<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thailand Renewable Energy Zones — Wind and Solar</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Turf.js — for dissolving/unioning polygon features -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
  /* ── RESET & BASE ─────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:      #0d1117;
    --paper:    #f5f3ee;
    --solar:    #f5a623;
    --wind:     #3b82f6;
    --grid:     #dc2626;
    --sub:      #7c3aed;
    --accent:   #1a9e6e;
    --muted:    #6b7280;
    --panel:    rgba(245,243,238,0.97);
    --shadow:   0 4px 32px rgba(13,17,23,0.14);
    --radius:   10px;
    --border:   #00e5a0;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--ink); color: var(--ink); }

  /* ── LAYOUT ───────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── TOP HEADER BAR ───────────────────────────── */
  #header {
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 62px;
    flex-shrink: 0;
    border-bottom: 2px solid var(--accent);
    z-index: 900;
  }
  #header .logo-block { display: flex; align-items: center; gap: 14px; }
  #header .logo-badge {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  #header .logo-badge svg { width: 20px; height: 20px; fill: #fff; }
  #header h1 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.2; }
  #header h1 span { display: block; font-weight: 400; font-size: 11px; color: #9ca3af; letter-spacing: 0.06em; text-transform: uppercase; }
  #header .meta { font-size: 11px; color: #9ca3af; text-align: right; letter-spacing: 0.04em; }
  #header .meta strong { color: var(--accent); display: block; font-size: 12px; }

  /* ── MAP WRAPPER ──────────────────────────────── */
  #map-container { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* ── LEFT PANEL ───────────────────────────────── */
  #panel {
    position: absolute;
    top: 18px; left: 18px;
    width: 260px;
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 800;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
  }
  #panel-header {
    background: var(--ink);
    color: #fff;
    padding: 14px 18px;
  }
  #panel-header h2 { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  #panel-header p  { font-size: 10.5px; color: #9ca3af; margin-top: 2px; }

  #panel-body { padding: 16px 18px; }

  .section-label {
    font-size: 9.5px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px; margin-top: 14px;
  }
  .section-label:first-child { margin-top: 0; }

  /* layer toggles */
  .layer-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    cursor: pointer;
    user-select: none;
  }
  .layer-row:last-child { border-bottom: none; }
  .layer-info { display: flex; align-items: center; gap: 10px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .swatch.line  { height: 3px; border-radius: 1px; }
  .swatch.dot   { border-radius: 50%; }
  .swatch.dashed {
    height: 3px; border-radius: 1px;
    background: transparent;
    border-top: 2px dashed var(--border);
    width: 18px;
  }
  .layer-name   { font-size: 12.5px; color: var(--ink); }
  .toggle-switch {
    width: 34px; height: 18px; border-radius: 9px;
    background: #d1d5db; position: relative; transition: background .2s;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content:''; position: absolute;
    width:14px; height:14px; border-radius:50%;
    background:#fff; top:2px; left:2px;
    transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .toggle-switch.on::after { left: 18px; }

  /* stats */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card {
    background: rgba(0,0,0,0.04); border-radius: 7px;
    padding: 9px 11px;
  }
  .stat-value { font-family:'Syne',sans-serif; font-size: 18px; font-weight: 800; line-height:1; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .stat-card.solar .stat-value { color: var(--solar); }
  .stat-card.wind  .stat-value { color: var(--wind); }
  .stat-card.grid  .stat-value { color: var(--grid); }
  .stat-card.sub   .stat-value { color: var(--sub);  }

  /* methodology badge */
  .method-badge {
    background: rgba(26,158,110,0.08);
    border: 1px solid rgba(26,158,110,0.2);
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 11px;
    color: var(--ink);
    line-height: 1.5;
  }
  .method-badge strong { color: var(--accent); }

  /* ── LOADING OVERLAY ──────────────────────────── */
  #loading {
    position: absolute; inset: 0;
    background: var(--ink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    gap: 20px;
    transition: opacity .5s ease;
  }
  #loading.fade-out { opacity: 0; pointer-events: none; }
  .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,.1); border-top-color: var(--accent); border-radius:50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color:#9ca3af; font-size:13px; letter-spacing:.06em; text-transform:uppercase; }

  /* ── INFO TOOLTIP ─────────────────────────────── */
  #info-tooltip {
    position: absolute;
    bottom: 60px; left: 50%; transform: translateX(-50%);
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 12px;
    z-index: 810;
    box-shadow: var(--shadow);
    max-width: 300px;
    display: none;
    border-left: 3px solid var(--accent);
  }
  #info-tooltip h4 { font-family:'Syne',sans-serif; font-size:13px; margin-bottom:4px; }

  /* Thailand border pulse animation */
  @keyframes borderPulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.55; }
    100% { opacity: 1; }
  }
  .thailand-border-glow {
    animation: borderPulse 3s ease-in-out infinite;
  }

  /* Leaflet overrides */
  .leaflet-control-attribution { font-size: 9px !important; background: rgba(245,243,238,.9) !important; }
  .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow) !important; }
  .leaflet-control-zoom a {
    background: var(--ink) !important; color: #fff !important;
    border: none !important; font-size: 16px !important;
    line-height: 26px !important; width: 28px !important; height: 28px !important;
  }
  .leaflet-control-zoom a:hover { background: #1f2937 !important; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div class="logo-block">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.2l7.5 3.75L12 11.7 4.5 7.95 12 4.2zM4 9.3l7 3.5v7l-7-3.5v-7zm9 10.5v-7l7-3.5v7l-7 3.5z"/></svg>
      </div>
      <h1>Thailand Renewable Energy Zones
        <span>Wind and Solar</span>
      </h1>
    </div>
  </div>

  <!-- MAP -->
  <div id="map-container">
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-msg">Loading spatial data…</div>
    </div>

    <div id="map"></div>

    <!-- LEFT CONTROL PANEL -->
    <div id="panel">
      <div id="panel-header">
        <h2>Layer Controls</h2>
        <p>Toggle map layers below</p>
      </div>
      <div id="panel-body">

        <div class="section-label">Data Layers</div>

        <div class="layer-row" onclick="toggleLayer('solar')">
          <div class="layer-info">
            <div class="swatch" style="background:var(--solar);"></div>
            <span class="layer-name">Solar Potential Zones</span>
          </div>
          <div class="toggle-switch on" id="sw-solar"></div>
        </div>

        <div class="layer-row" onclick="toggleLayer('wind')">
          <div class="layer-info">
            <div class="swatch" style="background:var(--wind);"></div>
            <span class="layer-name">Wind Potential Zones</span>
          </div>
          <div class="toggle-switch on" id="sw-wind"></div>
        </div>

        <div class="layer-row" onclick="toggleLayer('lines')">
          <div class="layer-info">
            <div class="swatch line" style="background:var(--grid);"></div>
            <span class="layer-name">Transmission Lines</span>
          </div>
          <div class="toggle-switch on" id="sw-lines"></div>
        </div>

        <div class="layer-row" onclick="toggleLayer('subs')">
          <div class="layer-info">
            <div class="swatch dot" style="background:var(--sub);"></div>
            <span class="layer-name">Substations</span>
          </div>
          <div class="toggle-switch on" id="sw-subs"></div>
        </div>

        <div class="section-label">Boundaries</div>

        <div class="layer-row" onclick="toggleLayer('border')">
          <div class="layer-info">
            <div class="swatch dashed"></div>
            <span class="layer-name">Thailand Border</span>
          </div>
          <div class="toggle-switch on" id="sw-border"></div>
        </div>

      </div>
    </div>

    <!-- HOVER TOOLTIP -->
    <div id="info-tooltip">
      <h4 id="tt-title">Feature Info</h4>
      <div id="tt-body"></div>
    </div>
  </div>

</div>

<script>
/* ── DATA URLS ──────────────────────────────────────────── */
const BASE = 'https://raw.githubusercontent.com/Zaigham26/Zaigham26.github.io/main/data/';
const URLS = {
  solar: BASE + 'solar.geojson',
  wind:  BASE + 'wind.geojson',
  lines: BASE + 'lines.geojson',
  subs:  BASE + 'substations.geojson',
  // Thailand boundary from a reliable public source
  border: 'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson',
};

/* ── MAP INIT ───────────────────────────────────────────── */
const map = L.map('map', {
  center: [15.5, 101.0],
  zoom: 6,
  zoomControl: false,
  attributionControl: true,
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

// Cartographic basemap (clean, muted)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

/* ── LAYERS ─────────────────────────────────────────────── */
const layers = {};
const layerVisible = { solar: true, wind: true, lines: true, subs: true, border: true };

const STYLES = {
  solar: { color: '#f5a623', fillColor: '#f5a623', fillOpacity: 0.35, weight: 1.2, opacity: 0.9 },
  wind:  { color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.35, weight: 1.2, opacity: 0.9 },
  lines: { color: '#dc2626', weight: 1.2, opacity: 0.7 },
  subs:  { radius: 6, fillColor: '#7c3aed', color: '#fff', weight: 1.5, fillOpacity: 0.9, opacity: 1 },
};

const LABELS = { solar: 'Solar Potential Zone', wind: 'Wind Potential Zone', lines: 'Transmission Line', subs: 'Substation' };

function showTooltip(name, props) {
  const tt = document.getElementById('info-tooltip');
  document.getElementById('tt-title').textContent = name;
  let html = '';
  if (props) {
    Object.entries(props).slice(0, 6).forEach(([k, v]) => {
      if (v !== null && v !== undefined && v !== '') {
        html += `<div style="margin:2px 0;font-size:11px;"><span style="color:#6b7280;">${k}:</span> ${v}</div>`;
      }
    });
  }
  if (!html) html = '<span style="color:#9ca3af;font-size:11px;">No additional attributes</span>';
  document.getElementById('tt-body').innerHTML = html;
  tt.style.display = 'block';
  setTimeout(() => { tt.style.display = 'none'; }, 5000);
}

/* ── THAILAND BORDER LAYER ──────────────────────────────── */
async function loadThailandBorder() {
  const res = await fetch(URLS.border);
  const gj = await res.json();

  // Filter only Thailand
  const thailand = {
    type: 'FeatureCollection',
    features: gj.features.filter(f =>
      f.properties && (
        f.properties.ADMIN === 'Thailand' ||
        f.properties.name === 'Thailand' ||
        f.properties.ISO_A2 === 'TH' ||
        f.properties.ISO_A3 === 'THA'
      )
    )
  };

  if (!thailand.features.length) {
    console.warn('Thailand feature not found in dataset');
    return;
  }

  // Outer glow layer (thick, semi-transparent)
  const glowLayer = L.geoJSON(thailand, {
    style: {
      color: '#00e5a0',
      weight: 8,
      opacity: 0.18,
      fillColor: '#00e5a0',
      fillOpacity: 0.04,
      dashArray: null,
    },
    interactive: false,
  });

  // Mid glow layer
  const midGlowLayer = L.geoJSON(thailand, {
    style: {
      color: '#00e5a0',
      weight: 4,
      opacity: 0.35,
      fill: false,
      dashArray: null,
    },
    interactive: false,
  });

  // Inner crisp border line
  const borderLayer = L.geoJSON(thailand, {
    style: {
      color: '#00e5a0',
      weight: 2,
      opacity: 1,
      fill: false,
      dashArray: '8 5',
      lineCap: 'round',
      lineJoin: 'round',
    },
    interactive: false,
  });

  // Group all three into a layer group
  const group = L.layerGroup([glowLayer, midGlowLayer, borderLayer]);

  // Apply pulse animation to the SVG paths after adding to map
  group.addTo(map);
  setTimeout(() => {
    document.querySelectorAll('.leaflet-overlay-pane path').forEach(p => {
      const stroke = p.getAttribute('stroke');
      if (stroke && stroke.toLowerCase() === '#00e5a0') {
        p.classList.add('thailand-border-glow');
      }
    });
  }, 300);

  layers['border'] = group;
}

async function loadLayer(key) {
  const res = await fetch(URLS[key]);
  const gj = await res.json();

  const count = gj.features ? gj.features.length : 0;
  const el = document.getElementById('cnt-' + key);
  if (el) el.textContent = count > 999 ? (count/1000).toFixed(1)+'k' : count;

  let layer;
  if (key === 'subs') {
    layer = L.geoJSON(gj, {
      pointToLayer: (f, latlng) => L.circleMarker(latlng, STYLES.subs),
      onEachFeature: (f, l) => {
        l.on('click', () => showTooltip(LABELS[key], f.properties));
        l.bindTooltip(f.properties?.name || 'Substation', { sticky: true, className: 'tt' });
      },
    });
  } else if (key === 'lines') {
    layer = L.geoJSON(gj, {
      style: STYLES.lines,
      onEachFeature: (f, l) => {
        l.on('click', () => showTooltip(LABELS[key], f.properties));
        l.on('mouseover', () => l.setStyle({ weight: 3, opacity: 1 }));
        l.on('mouseout',  () => l.setStyle(STYLES.lines));
      },
    });
  } else {
    const MAX_GAP_KM = 5;

    function distKm(a, b) {
      try { return turf.distance(a, b, { units: 'kilometers' }); } catch(e) { return Infinity; }
    }

    const features = gj.features.filter(f => f && f.geometry);
    const centroids = features.map(f => { try { return turf.centroid(f); } catch(e) { return null; } });

    const clusterOf = new Array(features.length).fill(-1);
    let clusterCount = 0;
    for (let i = 0; i < features.length; i++) {
      if (clusterOf[i] !== -1) continue;
      clusterOf[i] = clusterCount;
      const queue = [i];
      while (queue.length) {
        const cur = queue.shift();
        for (let j = 0; j < features.length; j++) {
          if (clusterOf[j] !== -1 || !centroids[cur] || !centroids[j]) continue;
          if (distKm(centroids[cur], centroids[j]) <= MAX_GAP_KM) {
            clusterOf[j] = clusterCount;
            queue.push(j);
          }
        }
      }
      clusterCount++;
    }

    const clusterPolygons = [];
    for (let c = 0; c < clusterCount; c++) {
      const members = features.filter((_, i) => clusterOf[i] === c);
      if (!members.length) continue;
      try {
        const pts = [];
        members.forEach(f => {
          try { turf.coordAll(f).forEach(co => pts.push(turf.point(co))); } catch(e) {}
        });
        if (pts.length < 3) {
          let u = members[0];
          for (let i = 1; i < members.length; i++) { try { u = turf.union(u, members[i]); } catch(e) {} }
          clusterPolygons.push(u); continue;
        }
        const ptCol = turf.featureCollection(pts);
        let hull = null;
        try { hull = turf.concave(ptCol, { maxEdge: MAX_GAP_KM, units: 'kilometers' }); } catch(e) {}
        if (!hull) { try { hull = turf.convex(ptCol); } catch(e) {} }
        if (!hull) {
          let u = members[0];
          for (let i = 1; i < members.length; i++) { try { u = turf.union(u, members[i]); } catch(e) {} }
          hull = u;
        }
        clusterPolygons.push(hull);
      } catch(e) {}
    }

    const dissolved = turf.featureCollection(clusterPolygons.filter(Boolean));

    layer = L.geoJSON(dissolved, {
      style: { ...STYLES[key], fillOpacity: 0.5, weight: 2 },
      onEachFeature: (f, l) => {
        l.on('click', () => showTooltip(LABELS[key], { Layer: LABELS[key], Source: 'AHP/MCDM Analysis', Note: 'Clustered & filled zone' }));
        l.on('mouseover', () => l.setStyle({ ...STYLES[key], fillOpacity: 0.7, weight: 2.5 }));
        l.on('mouseout',  () => l.setStyle({ ...STYLES[key], fillOpacity: 0.5, weight: 2 }));
      },
    });
  }

  layers[key] = layer;
  layer.addTo(map);
}

function toggleLayer(key) {
  layerVisible[key] = !layerVisible[key];
  const sw = document.getElementById('sw-' + key);
  sw.classList.toggle('on', layerVisible[key]);
  if (layers[key]) {
    if (layerVisible[key]) map.addLayer(layers[key]);
    else map.removeLayer(layers[key]);
  }
}

/* ── INIT ───────────────────────────────────────────────── */
(async () => {
  const msg = document.getElementById('loading-msg');

  msg.textContent = 'Loading Thailand boundary…';
  await loadThailandBorder();

  msg.textContent = 'Fetching GeoJSON data…';
  await Promise.all(['lines', 'subs'].map(loadLayer));

  msg.textContent = 'Dissolving solar zones…';
  await loadLayer('solar');

  msg.textContent = 'Dissolving wind zones…';
  await loadLayer('wind');

  // Bring border to front so it's visible above other layers
  if (layers['border']) layers['border'].eachLayer(l => l.bringToFront && l.bringToFront());

  // Remove loading screen
  const ld = document.getElementById('loading');
  ld.classList.add('fade-out');
  setTimeout(() => ld.remove(), 600);
})();
</script>
</body>
</html>
